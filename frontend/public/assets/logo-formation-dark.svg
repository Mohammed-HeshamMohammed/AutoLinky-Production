<svg xmlns="http://www.w3.org/2000/svg" class="is-forming" viewBox="0 0 405 80" role="img" aria-labelledby="af-title"><title id="af-title">AutoLinky logo formation</title><style>
@keyframes af-draw { 0% { stroke-dashoffset:1;opacity:0 } .1% { opacity:1 } 100% { stroke-dashoffset:0;opacity:1 } }
@keyframes af-wipe { from { transform:scaleX(0) } to { transform:scaleX(1) } }
@keyframes af-settle { from { opacity:0 } to { opacity:1 } }
@keyframes af-dot-bounce {0% { transform:translateY(-22px);opacity:0;animation-timing-function:linear }1% { transform:translateY(-22px);opacity:1;animation-timing-function:cubic-bezier(.55,0,.9,.5) }38% { transform:translateY(4.107599029541014px);opacity:1;animation-timing-function:linear }42% { transform:translateY(4.107599029541014px);opacity:1;animation-timing-function:cubic-bezier(.15,.55,.35,1) }62% { transform:translateY(-3.2px);opacity:1;animation-timing-function:cubic-bezier(.55,0,.9,.5) }80% { transform:translateY(4.107599029541014px);opacity:1;animation-timing-function:linear }84% { transform:translateY(4.107599029541014px);opacity:1;animation-timing-function:cubic-bezier(.15,.55,.35,1) }93% { transform:translateY(-0.7px);opacity:1;animation-timing-function:ease-in-out }100% { transform:none;opacity:1;animation-timing-function:linear }}
@keyframes af-dot-hide { to { visibility:hidden } }
@keyframes af-dot-show { to { visibility:visible } }
.af-trace { stroke-dasharray:1 2;stroke-dashoffset:0 }
.af-settle { opacity:1 }
.af-dot-rest { display:none }
@media (prefers-reduced-motion:no-preference) {
  .is-forming .af-trace { stroke-dashoffset:1;animation:af-draw var(--duration) var(--ease) var(--delay) both }
  .is-forming .af-wipe { transform-box:fill-box;transform-origin:left center;animation:af-wipe var(--duration) cubic-bezier(.22,.7,.2,1) var(--delay) both }
  .is-forming .af-settle { opacity:0;animation:af-settle .001s steps(1,end) 2.5s forwards }
  .is-forming .af-dot { animation:af-dot-bounce var(--duration) linear var(--delay) both,af-dot-hide .001s steps(1,end) 2.45s forwards }
  .is-forming .af-dot-rest { display:block;visibility:hidden;animation:af-dot-show .001s steps(1,end) 2.45s forwards }
}
@media (prefers-reduced-motion:reduce) {
  .is-forming .af-trace { stroke-dashoffset:0;opacity:1;animation:none }
  .is-forming .af-wipe { transform:none;animation:none }
  .is-forming .af-settle { opacity:1;animation:none }
  .is-forming .af-dot { transform:none;opacity:1;animation:none }
}
