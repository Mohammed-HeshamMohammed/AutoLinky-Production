name: autolinky
description: "Autolinky: jobs matched to your CV"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  # Firebase iOS 12.19 is compatible with the Google Sign-In 9.x Swift package.
  firebase_core: 4.15.0
  firebase_auth: 6.7.0
  app_links: 7.2.2
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  intl: any
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.5.0
  cupertino_ui: ^1.1.1
  file_picker: ^13.1.0
  flutter_local_notifications: 21.0.0
  workmanager: ^0.10.10
  shorebird_code_push: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  shared_preferences_platform_interface: ^2.4.2

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  generate: true                      # lib/l10n/gen from lib/l10n/*.arb (l10n.yaml)
  assets:
    - assets/brand/
    - shorebird.yaml
  fonts:
    # One family for Arabic and English (IBM Plex Sans Arabic, SIL OFL: assets/fonts/OFL.txt), bundled: no network
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
