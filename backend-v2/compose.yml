name: autolinky-services
x-backend: &backend
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]
  networks: [services]
services:
  gateway:
    <<: *backend
    image: autolinky-gateway:development
    build: {context: .., dockerfile: Gateway-backene/Dockerfile}
    command: [node, Gateway-backene/index.js]
    env_file: [.runtime/deployment/gateway.env]
    ports: ["127.0.0.1:4100:4100"]
    depends_on: [auth, app, messaging]
  auth:
    <<: *backend
    image: autolinky-auth:development
    build: {context: .., dockerfile: Auth-backend/Dockerfile}
    command: [node, Auth-backend/index.js]
    env_file: [.runtime/deployment/auth.env]
    volumes: ["./.runtime/deployment/firebase-admin.json:/run/secrets/firebase-admin.json:ro"]
  app:
    <<: *backend
    image: autolinky-app:development
    build: {context: .., dockerfile: App-backend/Dockerfile}
    command: [node, App-backend/index.js]
    env_file: [.runtime/deployment/app.env]
  messaging:
    <<: *backend
    image: autolinky-messaging:development
    build: {context: .., dockerfile: Notify-backend/Dockerfile}
    command: [node, Notify-backend/index.js]
    env_file: [.runtime/deployment/messaging.env]
  sender:
    <<: *backend
    image: autolinky-messaging:development
    build: {context: .., dockerfile: Notify-backend/Dockerfile}
    command: [node, Notify-backend/sender.js]
    env_file: [.runtime/deployment/messaging.env]
    profiles: [sender]
  fetching:
    <<: *backend
    image: autolinky-fetching:development
    build: {context: .., dockerfile: Fetching-backend/Dockerfile}
    command: [node, Fetching-backend/index.js]
    env_file: [.runtime/deployment/fetching.env]
  data:
    <<: *backend
    image: autolinky-data:development
    build: {context: .., dockerfile: Data-baceknd/Dockerfile}
    command: [node, Data-baceknd/index.js]
    env_file: [.runtime/deployment/data.env]
networks:
  services:
    driver: bridge
