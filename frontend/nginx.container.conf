# Optional proxy container only; Node frontend is the actual unified server.
# Put both containers on one private network; Dokploy/Traefik terminates TLS.
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 4m;
    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }
}
