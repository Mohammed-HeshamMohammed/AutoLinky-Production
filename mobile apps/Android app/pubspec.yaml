name: autolinky_android
description: AutoLinky Android app with shared Flutter screens.
publish_to: 'none'
version: 1.0.1+2
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  autolinky:
    path: ../shared
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - shorebird.yaml
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
