# ══════════════════════════════════════════════════════════════════════════════
#  Autolinky collector: الإعدادات
# ══════════════════════════════════════════════════════════════════════════════
#
#  الملف ده بيتقري أوتوماتيك لما تشغّل:
#      python collector/run_forever.py
#
#  • أي flag تكتبه في الأمر بيغلب الملف للمرة دي بس (من غير ما تعدّل الملف):
#      python collector/run_forever.py --date-posted past-24h --max-cycles 1
#  • عايز أكتر من نسخة إعدادات؟ اعمل ملف تاني وشغّل بيه:
#      python collector/run_forever.py --config collector/settings_month.toml
#  • لو كتبت اسم إعداد غلط أو قيمة مش مسموحة، البرنامج هيقف ويقولك الغلط فين بالظبط.
#  • الأسرار (الـ cookies ومفاتيح الـ API) مكانها .env و accounts.json، مش هنا.
#
#  القواعد: النص بين "علامات تنصيص"، والأرقام من غيرها، و true / false صغيرين،
#  والقوايم كده: ["a", "b"]. وأي سطر بيبدأ بـ # ده شرح وبيتجاهل.
# ══════════════════════════════════════════════════════════════════════════════


[sources]
# بيجمع منين (الاتنين شغالين مع بعض، أو واحد بس):
#   posts: بوستات التوظيف (Posts). محتاج حسابات LinkedIn في accounts.json
#   jobs:  قسم الوظايف (Jobs) في LinkedIn. مش محتاج أي حساب خالص
posts = true
jobs = true

# تصنيف كل بوست ووظيفة جديدة (المجال، الدور، الـ skills، المستوى...) عشان الأبليكيشن والـ matching.
# بيشتغل كل دقيقتين من غير AI ومن غير تكلفة. الكلمات والمجالات في collector/taxonomy.toml
enrich = true


[search]
# ── إعدادات البوستات (Posts) ──
# طريقة البحث:
#   "http"    سريع وخفيف من غير متصفح (الافتراضي، استخدمه دايماً)
#   "chrome"  بالمتصفح، احتياطي لو طريقة http بطّلت تشتغل في يوم
engine = "http"

# البوستات من آخر قد إيه:
#   "past-24h"    آخر 24 ساعة: أحدث حاجة، ونتايج أقل
#   "past-week"   آخر أسبوع (الافتراضي)
#   "past-month"  آخر شهر: requests أكتر على الفاضي، لأن أي بوست أقدم من أسبوعين بيتساب ومبيتحفظش
#   "any"         من غير حد زمني (نفس الكلام)
date_posted = "past-week"

# ترتيب النتايج:
#   "auto"       الأحدث الأول، ولو الحساب مش بيرجّع نتايج بالترتيب ده يتحوّل لـ relevance
#                لوحده ويرجع يجرّب كل دورة (الأفضل)
#   "date"       الأحدث الأول دايماً
#   "relevance"  الأقرب للبحث دايماً
sort = "auto"

# بحث واحد لكل مسمى ولكل دولة بالـ operators بتاعة LinkedIn (search_query.py):
#   ("network engineer" OR "network engineers" OR "networking engineer") (egypt OR cairo OR giza OR alexandria)
# جرّبناه على LinkedIn يوم 7 أكتوبر 2026: جاب نفس الوظايف بالظبط اللي بتجيبها 4 أبحاث "network engineer cairo"...
# بـ 4 requests بدل 28، وبيقرا 63 بوست بدل 527 (البحث من غير علامات التنصيص بيجيب أي "engineer" في مصر).
# LinkedIn بيقبل 5 operators بالكتير في البحث الواحد (OR / AND / NOT)، والكود بيلتزم بده لوحده.
#   false = بحث لكل مسمى ولكل مكان زي الأول ("network engineer cairo")
operators = true

# أول بحث للمسمى الجديد (يوزر جديد رفع الـ CV بتاعه ومسمياته لسه محدش بحث عنها):
#   true  = بيتبحث خلال 15 ثانية مهما كانت الدورة بتعمل إيه (راحة، مستنية بحث، أو في نصها):
#           كل حساب بيشغّل worker زيادة للأبحاث دي بس، والـ requests بتاعته بتاخد الدور الجاي في الحساب
#           قبل الباقيين (نفس عدد الـ requests في الدقيقة، مفيش ضغط زيادة على الحساب)، والبوستات بتاعته
#           بتروح للـ AI الأول، والتصنيف بيشتغل كل 5 ثواني لحد ما يخلص: اليوزر بيشوف الوظايف بتيجي أول بأول.
#           ده بيحصل مرة واحدة بس لكل مسمى جديد، وبعدها الـ scheduler بيبحث عنه زي أي مسمى تاني.
#   false = المسمى الجديد بيدخل قدّام الطابور العادي بس (زي الأول)
first_searches = true

# أقصى وقت لبحث واحد بالدقايق. البحث بيقف قبلها لوحده لو النتايج خلصت (أغلب الأبحاث بتخلص في دقيقة أو اتنين).
# LinkedIn بيعرض بالكتير حوالي 370 بوست للبحث الواحد (حوالي 6 دقايق)، فـ 15 بتكفي أي بحث للآخر.
minutes_per_search = 15

# في ترتيب الأحدث: يوقف البحث بعد كام بوست ورا بعض اتحلّلوا قبل كده
# (معناها وصلنا لبوستات شفناها في دورة قبل كده).
stop_after_dups = 5

# المسميات اللي هيدوّر عليها:
#   []  = اللي اليوزرز محتاجينها (الطبيعي): كل CV بيطلّع من 3 لـ 5 مسميات، والداتابيز بتحطها في
#         جدول search_titles لوحدها ومعاها عدد اليوزرز اللي عايزين كل مسمى (عمود users).
#         • مفيش ولا يوزر رفع CV = الـ collector بيستنى ويبص كل دقيقة، ومن غير ما يحسبها دورة.
#         • يوزر ضاف مسمى جديد = بيتبحث خلال 15 ثانية، قبل أي حاجة تانية (البوستات والوظايف)،
#           حتى لو في نص دورة أو في الراحة بين دورتين (شوف first_searches فوق).
#         • المسمى اللي يوزرز أكتر عايزينه بيتبحث الأول وبيرجعله أسرع (شوف popular_max_speedup تحت).
#         • تضيف مسمى بإيدك من غير يوزر: في جدول search_titles خلّي manual = true
#           وتوقّف مسمى خالص: active = false
#   أو قايمة للتجربة بس، مثلاً: ["full stack developer", "data analyst"]
#   (لما تكتب قايمة، الـ scheduler بيتجاهل المواعيد وبيبحث فيهم كلهم)
titles = []


[locations]
# يجمع لأنهي أماكن (البوستات والوظايف مع بعض، كل دورة):
#   "ask"                يسألك أول ما يشتغل (Enter = اختيارك المرة اللي فاتت). على السيرفر (من غير كيبورد)
#                        بياخد آخر اختيار، أو "users" لو أول مرة
#   "egypt"              مصر ومدنها
#   "egypt_gulf"         مصر + الخليج (السعودية، الإمارات، قطر، الكويت، البحرين، عمان)
#   "egypt_remote"       مصر + remote
#   "egypt_gulf_remote"  مصر + الخليج + remote
#   "remote"             remote بس
#   "worldwide"          كل مسمى في كل مكان، حتى لو اليوزرز بتوعه مش عايزين المكان ده
#   "users"              زي اليوزرز: كل مسمى في الأماكن اللي اليوزرز بتوعه اختاروها بس (الأذكى)
# من 1 لـ 5 بيحترموا اختيار اليوزرز كمان: المكان لازم يبقى في اختيارك وفي اختيار يوزر عايز المسمى ده.
# ولمرة واحدة من غير ما تعدّل الملف:  python collector/run_forever.py --scope egypt
scope = "ask"

# أماكن للتجربة بدل Supabase، مثلاً: ["egypt", "dubai"].  [] = من Supabase (الطبيعي)
regions = []


[schedule]
# ساعات الشغل (بتوقيت الجهاز). بره الساعات دي الـ collector بيستنى.
#   "" = 24 ساعة، بنفس السرعة بالليل والنهار (الافتراضي) | "9-22" = من 9 الصبح لـ 10 بالليل | "22-6" = طول الليل
active_hours = ""

# مفيش "راحة" بين الدورات: أول ما دورة تخلص، اللي عليه الدور بيبدأ على طول، ولو مفيش حاجة عليها الدور
# بيستنى لحد أقرب بحث (أو لحد ما يوزر يضيف مسمى جديد). الرقم ده أقل وقت بين دورتين بالدقايق (0 = من غير).
cycle_rest_minutes = 0

# يقف بعد كام دورة. 0 = يفضل شغّال على طول.
max_cycles = 0

# true = يبحث في كل حاجة كل دورة ويتجاهل المواعيد الذكية تحت (للتجارب بس)
ignore_schedule = false

# المواعيد الذكية: كل بحث بيتعاد بعد قد إيه حسب آخر نتيجة ليه (بالساعات):
# (البحث بالـ operators أرخص 7 مرات، فبيرجع أسرع من الأول: كان 6 / 12 / 24 / 48)
hours_if_new_jobs = 2       # جاب وظايف جديدة: يرجعله بسرعة
hours_if_known_jobs = 4     # لقى وظايف بس كلها متسجّلة قبل كده
hours_if_no_jobs = 8        # فيه بوستات بس مفيهاش وظايف
hours_if_empty = 24         # مفيش نتايج خالص: يوم، وبتتضاعف كل مرة فاضية...
max_hours_if_empty = 336    # ...لحد أقصى أسبوعين

# المسمى اللي يوزرز كتير عايزينه بيرجعله أسرع من المواعيد اللي فوق بالنسبة دي:
#   يوزر واحد x1 | 2 يوزرز x1.5 | 4 x2 | 16 يوزر أو أكتر = الرقم ده (3 = أسرع 3 مرات)
#   مثلاً بحث جاب وظايف جديدة: كل 6 ساعات ليوزر واحد، وكل ساعتين لمسمى 16 يوزر عايزينه.
#   1 = كله زي بعضه
popular_max_speedup = 3


[accounts]
# ملف حسابات LinkedIn. "" = collector/accounts.json
# (لو الملف مش موجود: حساب واحد من LINKEDIN_LI_AT و LINKEDIN_JSESSIONID في .env)
accounts_file = ""

# القيم دي للحسابات اللي مش محدد لها "workers" أو "requests_per_minute" في accounts.json:
workers = 3                  # كام بحث بالتوازي لكل حساب
requests_per_minute = 4      # أقصى requests في الدقيقة لكل حساب. أهم إعداد لأمان الحساب: متزوّدش عن 6

# لو حساب LinkedIn قفل عليه البحث (throttle)، الـ workers بتوعه يقفوا قد إيه بالدقايق.
throttle_pause_minutes = 180

# بعد كام بحث فاضي ورا بعض يتأكد إذا كان الحساب عليه throttle (بيجرّب بحث مضمون).
empty_searches_before_canary = 6


[jobs]
# ── إعدادات قسم الوظايف (Jobs) ──
# بيستخدم نفس المسميات ونفس المواعيد الذكية بتاعة البوستات، ومن غير أي حساب LinkedIn.

# الوظايف المنشورة في آخر كام ساعة:
#   24 = يوم | 48 = يومين | 168 = أسبوع | 336 = أسبوعين (الأقصى: الأقدم مبيتحفظش)
posted_within_hours = 168

# أول مرة بحث معيّن بيشتغل (مسمى جديد من CV يوزر) بيرجع لورا أكتر وبيقرا كل الصفحات، عشان اليوزر
# الجديد يلاقي وظايف كتير من أول يوم. بعد كده بيرجع للـ posted_within_hours اللي فوق.
#   336 = أسبوعين، وده الأقصى: أي وظيفة أقدم من أسبوعين مبتتجمعش وبتتمسح من الداتا بيز
#   (MAX_JOB_AGE_DAYS في collector/job_age.py)، فأي رقم أكبر بيتعامل كأنه 336
# ولو عايز تعمل ده لكل البحوث مرة واحدة دلوقتي (مثلاً بعد ما تمسح الداتا):  --jobs-backfill --max-cycles 1
first_run_posted_within_hours = 336

# ترتيب النتايج: "date" الأحدث الأول (الأفضل: بيقف أول ما يوصل لوظايف متسجّلة قبل كده) | "relevance"
sort = "date"

# الأماكن: نفس scope اللي في [locations]، بس بحث واحد لكل دولة (LinkedIn لما تقوله "Egypt" بيجيب
# وظايف القاهرة والجيزة واسكندرية كلها، فالبحث بكل مدينة لوحدها كان بيجيب نفس الوظايف تاني).

# ── السرعة ──
# كام بحث شغالين في نفس الوقت. كلهم بيتقاسموا السرعة اللي تحت،
# فزيادتهم مش بتعدّي الحد: 4 كفاية يوصلوا لـ 90 في الدقيقة (الطلب بياخد أقل من ثانية).
# زوّدهم بس لو النت بطيء والـ "rate now" في اللوج أقل من الحد.
workers = 4

# السرعة اللي بيبدأ بيها (requests في الدقيقة). ده على الـ IP بتاعك، مش على حسابات LinkedIn.
requests_per_minute = 60

# أقصى سرعة. بيزوّد 5 كل دقيقة تعدّي من غير مشاكل لحد الرقم ده.
# لو LinkedIn قال "كفاية" (429): بيقلّل السرعة 30% ويستنى 15 ثانية، ويكمّل لوحده.
# اتجرب على النت البيتي: مرة 60 و 90 اشتغلوا 4 دقايق من غير ولا 429 (و 120 اتمنع في ثواني)،
# ومرة تانية بالليل LinkedIn سمح بحوالي 50 بس. الحد بيتغير، فعشان كده السرعة بتظبط نفسها.
# لو عايز سرعة ثابتة: خليه نفس رقم requests_per_minute.
max_requests_per_minute = 90

# أقصى عدد صفحات لكل بحث (كل صفحة 10 وظايف). 20 = لحد 200 وظيفة للبحث الواحد.
# مع sort = "date" بيقف بدري لوحده أول ما يلاقي صفحة كلها متسجّلة.
max_pages = 20

# true = يجيب لكل وظيفة جديدة الوصف والمستوى ونوع الشغل ونوع التقديم (Easy Apply ولا موقع الشركة).
#        بيضيف request لكل وظيفة جديدة بس. false = البيانات الأساسية بس (أسرع 10 مرات تقريباً).
fetch_details = true

# أقصى وقت للطلب الواحد بالثواني. لو LinkedIn أو النت بطّأ أكتر من كده، الطلب بيتلغي
# والسرعة بتقل شوية، بدل ما البرنامج يفضل مستني.
request_timeout_seconds = 30

# لو LinkedIn فضل يقول "كفاية" 5 مرات ورا بعض، قسم الوظايف يقف المدة دي (بالدقايق) ويبعتلك تنبيه.
# البوستات مبتتأثرش.
throttle_pause_minutes = 15


[ai]
# الموديل اللي بيحلل البوستات (عن طريق OpenRouter):
#   "google/gemini-2.5-flash-lite"   الأرخص (الافتراضي)
#   "google/gemini-2.5-flash"        مسميات وظايف أدق، وسعر التوكن أغلى
# اتقاس على 150 بوست حقيقي (scripts/eval_ai.py، أكتوبر 2026): flash-lite بيعرف الدور زي الموديلات الأحدث
# (93%، وده اللي الـ matching بيستخدمه) وأدقهم في remote، وبأقل تمن ($0.038 لكل 1000 بوست).
model = "google/gemini-2.5-flash-lite"

# كام بوست في طلب الـ AI الواحد. أكبر = توكنز أقل بس دقة أقل مع الموديل الرخيص. 5 هو الأحسن في التجارب.
batch_size = 5

# كام thread بيكلّموا الـ AI. 0 = تلقائي (3 لطريقة http)
threads = 0

# المسميات اللي ملف التصنيف (taxonomy.toml) مش عارفها: الـ AI يختارلها دور من القايمة.
# كل مسمى بيتسأل عليه مرة واحدة بس وبيتحفظ، فالتكلفة تقريباً صفر.
# شوف اللي اتعلمه:  python collector/enricher.py --suggest
classify_titles = true

# أقصى عدد مسميات جديدة بتروح للـ AI في الدورة الواحدة (كل دقيقتين).
titles_per_run = 200

# الـ AI يقرا كل وظيفة مرة واحدة: المهارات المطلوبة والمفضّلة وأقل سنين خبرة والمؤهل.
# ده اللي بيخلّي الـ matching يفرّق بين "مطلوب" و"ميزة إضافية". بيتحفظ، والوظيفة بتتقري تاني بس لو نصها اتغيّر.
# التكلفة: حوالي دولار لكل 6 آلاف وظيفة بالموديل الرخيص.
read_requirements = true

# أقصى عدد وظايف يقراها في الدورة الواحدة (كل دقيقتين).
requirements_per_run = 300

# الموديل اللي بيقرا المتطلبات. "" = نفس الموديل اللي فوق (model).
# اتقاس على 100 وظيفة حقيقية (scripts/eval_ai.py، أكتوبر 2026)، دقة المهارات المطلوبة وتمن 1000 وظيفة:
#   google/gemini-2.5-flash-lite   76%   $0.082
#   openai/gpt-6-luna              83%   $0.059   <- أدق وأرخص (بيرد من غير تفكير: classifier.no_thinking)
#   qwen/qwen3.7-flash             81%   $0.024
#   google/gemini-3.5-flash-lite   86%   $0.351
requirements_model = "openai/gpt-6-luna"

# القاموس بيتعلم مهارات جديدة لوحده: أي اسم مهارة مش معروف ظهر في 3 إعلانات وظايف مختلفة أو أكتر،
# الـ embedder (موديل e5) بيقترح أقرب مهارات معروفة، والـ AI بيقرر: نفس مهارة موجودة، ولا مهارة جديدة،
# ولا كلام عام (زي "troubleshooting"). اللي اتعلم بيتستخدم في قراية أسماء المهارات بس، ومش بيتدوّر عليه
# في النصوص. تشوفه وتلغي أي حاجة منه:  python scripts/learned_skills.py
# التكلفة: حوالي سنت لكل 150 اسم. لو الـ embedder مش شغال، بيقارن بالحروف بس.
learn_skills = true

# كل كام ساعة يتعلم (الأسماء الجديدة بتتجمع ببطء)
learn_every_hours = 6


[chrome]
# الإعدادات دي بتفرق بس لو engine = "chrome"
headless = false             # true = من غير نافذة (للسيرفر)
recycle_after = 20           # يعيد تشغيل Chrome بعد كام بحث (عشان الرام)
refresh_profiles = false     # true = ينسخ الـ profile الأساسي من جديد للـ workers
