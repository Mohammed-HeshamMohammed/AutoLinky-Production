# ═══════════════════════════════════════════════════════════════════════════════════════════
# تصنيف الوظايف (Taxonomy): المصدر الوحيد للتصنيف في المشروع كله
#
#   fields     المجالات الكبيرة (Networking، Accounting...) بالإنجليزي والعربي وأيقونة للأبليكيشن
#   relations  المجالات القريبة من بعض ووزنها (0 لـ 1): Network Engineer بيترشحله Security و IT
#   roles      الأدوار جوه كل مجال + الكلمات اللي بيتعرف بيها من مسمى الوظيفة (إنجليزي/عربي/ألماني...)
#   skills     المهارات اللي بتتلقط من المسمى والوصف (CCNA، Python، SAP...)
#
# إزاي التصنيف بيشتغل (collector/taxonomy.py):
#   - المسمى بيتنضف (حروف صغيرة، من غير رموز، "ال" العربي بيتشال) ونفس الشيء للكلمات هنا،
#     فاكتب الكلمة بأي شكل: "Back-End Developer" = "back end developer".
#   - أطول كلمة تطابق هي اللي بتكسب: "noc engineer" تكسب "network engineer" تكسب "engineer".
#     ولو اتنين بنفس الطول: اللي في آخر المسمى (الإسم الأساسي في الإنجليزي بييجي في الآخر).
#   - لو مفيش ولا كلمة: المجال "other" وبيظهر في تقرير الـ enricher عشان نضيف كلمات.
#
# بعد أي تعديل:  python scripts/sync_taxonomy.py   ثم   python collector/enricher.py --all
# (الـ enricher بيلاحظ إن الملف اتغير ويعيد تصنيف كل الفرص لوحده)
# ═══════════════════════════════════════════════════════════════════════════════════════════

