name: autolinky-services
x-backend: &backend
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]
  networks: [services]
services:
  gateway:
    <<: *backend
    image: autolinky-gateway:development
    build: {context: ., dockerfile: services/gateway/Dockerfile}
    command: [node, services/gateway/index.js]
    env_file: [.runtime/deployment/gateway.env]
    ports: ["127.0.0.1:4100:4100"]
    depends_on: [auth, app, messaging]
  auth:
    <<: *backend
    image: autolinky-auth:development
    build: {context: ., dockerfile: services/auth/Dockerfile}
    command: [node, services/auth/index.js]
    env_file: [.runtime/deployment/auth.env]
    volumes: ["./.runtime/deployment/firebase-admin.json:/run/secrets/firebase-admin.json:ro"]
  app:
    <<: *backend
    image: autolinky-app:development
    build: {context: ., dockerfile: services/app/Dockerfile}
    command: [node, services/app/index.js]
    env_file: [.runtime/deployment/app.env]
  messaging:
    <<: *backend
    image: autolinky-messaging:development
    build: {context: ., dockerfile: services/messaging/Dockerfile}
    command: [node, services/messaging/index.js]
    env_file: [.runtime/deployment/messaging.env]
  sender:
    <<: *backend
    image: autolinky-messaging:development
    build: {context: ., dockerfile: services/messaging/Dockerfile}
    command: [node, services/messaging/sender.js]
    env_file: [.runtime/deployment/messaging.env]
    profiles: [sender]
  fetching:
    <<: *backend
    image: autolinky-fetching:development
    build: {context: ., dockerfile: services/fetching/Dockerfile}
    command: [node, services/fetching/index.js]
    env_file: [.runtime/deployment/fetching.env]
  data:
    <<: *backend
    image: autolinky-data:development
    build: {context: ., dockerfile: services/data/Dockerfile}
    command: [node, services/data/index.js]
    env_file: [.runtime/deployment/data.env]
networks:
  services:
    driver: bridge
