name: Native Swift iOS checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile apps/IOS app/**', 'mobile apps/release-source.json', '.github/workflows/ios-v2.yml', '!**/*.md']
permissions:
  contents: read
concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile apps/IOS app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify native core contracts
        run: swift test --package-path Core
      - name: Install native project generator
        run: brew install xcodegen
      - name: Prepare native project
        run: |
          python3 scripts/prepare.py --mode simulator --api-url ''
          xcodegen generate
      - name: Compile and test native SwiftUI app
        run: |
          device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          xcodebuild -project AutoLinky.xcodeproj -scheme AutoLinky -configuration Debug -destination "platform=iOS Simulator,id=$device" -derivedDataPath .runtime/DerivedData -resultBundlePath .runtime/NativeTests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent .runtime/DerivedData/Build/Products/Debug-iphonesimulator/AutoLinky.app .runtime/AutoLinky-simulator.zip
      - name: Export native UI screenshots
        if: always()
        run: |
          if test -d .runtime/NativeTests.xcresult; then
            xcrun xcresulttool export attachments --path .runtime/NativeTests.xcresult --output-path .runtime/screenshots
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: AutoLinky-native-iOS-verification
          path: |
            mobile apps/IOS app/.runtime/AutoLinky-simulator.zip
            mobile apps/IOS app/.runtime/NativeTests.xcresult
            mobile apps/IOS app/.runtime/screenshots
          if-no-files-found: warn
          retention-days: 7
